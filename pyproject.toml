[project]
name = "nexusgraph"
version = "0.1.0"
description = "GraphRAG + Knowledge Graph Agent: answers complex questions by routing across RDF/SPARQL, SQL, and vector retrieval with citations, provenance and traces."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "NexusGraph contributors" }]
keywords = ["graphrag", "knowledge-graph", "rdf", "sparql", "agents", "rag", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "pyoxigraph>=0.4.13",
    "redis>=5.0",
    "numpy>=2.0",
    "httpx>=0.27",
    "opentelemetry-api>=1.26",
    "opentelemetry-sdk>=1.26",
    "opentelemetry-exporter-otlp>=1.26",
    "mcp>=1.2",
    "pypdf>=4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "fpdf2>=2.7",
]

[project.scripts]
nexusgraph = "nexusgraph.cli:main"

[project.urls]
Homepage = "https://github.com/nexusgraph/nexusgraph"
Documentation = "https://github.com/nexusgraph/nexusgraph/tree/main/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexusgraph"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: tests that require running services (Postgres/Redis) - deselect with '-m \"not integration\"'",
    "slow: long-running tests",
]
filterwarnings = ["ignore::DeprecationWarning:mcp.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "evals", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RET", "PL"]
ignore = ["PLR0913", "PLR2004", "PLR0912", "PLR0915", "PLR0911", "RET504"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR", "B008", "SIM117"]
"evals/*" = ["PLR"]

[tool.mypy]
python_version = "3.12"
strict = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = ["build", "dist", "data"]

[[tool.mypy.overrides]]
module = [
    "pyoxigraph.*", "pgvector.*", "pypdf.*", "fpdf.*", "mcp.*",
    "opentelemetry.*", "uvicorn.*", "redis.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/nexusgraph"]
omit = ["*/ui/static/*"]

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Ruff
        run: uv run ruff check src tests evals
      - name: Ruff format
        run: uv run ruff format --check src evals
      - name: mypy
        run: uv run mypy src evals

  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexusgraph
          POSTGRES_PASSWORD: nexusgraph
          POSTGRES_DB: nexusgraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexusgraph"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Run tests
        env:
          # the local-profile suite runs everywhere; services above exist for
          # postgres-profile smoke tests
          NEXUSGRAPH_DATABASE_URL: postgresql+psycopg://nexusgraph:nexusgraph@localhost:5432/nexusgraph
          NEXUSGRAPH_REDIS_URL: redis://localhost:6379/0
        run: uv run pytest -v

  evals:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Run deterministic eval suite
        run: |
          uv run nexusgraph bootstrap
          uv run python -m evals.run
      - name: Upload eval report
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/results/report.md
